name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o pdfmaker-android-project.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android project and sync
        working-directory: pdfmaker
        run: node setup.js

      - name: Build debug APK
        working-directory: pdfmaker/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Maker-debug-apk
          path: pdfmaker/android/app/build/outputs/apk/debug/app-debug.apk
